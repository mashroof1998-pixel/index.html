  });
  const exportEmployeesListBtn = document.getElementById('exportEmployeesListBtn');
  if(exportEmployeesListBtn) exportEmployeesListBtn.addEventListener('click', ()=>{ const aoa=[['الكود','الاسم','الوظيفة','الهاتف','الراتب الأساسي']]; state.employees.forEach(e=>aoa.push([e.code,e.name,e.position||'',e.phone||'',e.baseSalary||0])); safeExport('قائمة_الموظفين',[{name:'الموظفون',aoa}]); });
  const savePayrollBtn = document.getElementById('savePayrollBtn');
  if(savePayrollBtn) savePayrollBtn.addEventListener('click', async ()=>{
    const employeeId=document.getElementById('payrollEmployee').value, period=document.getElementById('payrollPeriod').value;
    const baseSalary=Number(document.getElementById('payrollBase').value)||0, additions=Number(document.getElementById('payrollAdditions').value)||0, deductions=Number(document.getElementById('payrollDeductions').value)||0;
    const date=document.getElementById('payrollDate').value;
    if(!employeeId){ alert('اختر موظفاً'); return; } if(!period){ alert('اختر الشهر'); return; } if(baseSalary<=0){ alert('أدخل الراتب الأساسي'); return; } if(!date){ alert('أدخل تاريخ الصرف'); return; }
    await createPayrollSlip(employeeId, period, baseSalary, additions, deductions, date); renderAll();
  });
  const stmtEmployeeSelect = document.getElementById('stmtEmployeeSelect'); if(stmtEmployeeSelect) stmtEmployeeSelect.addEventListener('change', e=>{ stmtEmployeeId=e.target.value; renderAll(); });
  bindRep('stmtEmployeeFrom', v=>stmtEmployeeFrom=v); bindRep('stmtEmployeeTo', v=>stmtEmployeeTo=v);
  const exportEmployeeStmtBtn = document.getElementById('exportEmployeeStmtBtn'); if(exportEmployeeStmtBtn) exportEmployeeStmtBtn.addEventListener('click', ()=>exportEmployeeStatement(stmtEmployeeId, stmtEmployeeFrom, stmtEmployeeTo));

  /* Users */
  document.querySelectorAll('[data-perm-tab]').forEach(cb=>cb.addEventListener('change', ()=>{
    const t = cb.dataset.permTab;
    if(cb.checked){ if(!draftUserAllowed.includes(t)) draftUserAllowed.push(t); } else { draftUserAllowed = draftUserAllowed.filter(x=>x!==t); }
  }));
  const addUserBtn = document.getElementById('addUserBtn');
  if(addUserBtn) addUserBtn.addEventListener('click', async ()=>{
    const name=document.getElementById('userName').value.trim();
    const username=document.getElementById('userUsername').value.trim();
    const password=document.getElementById('userPassword').value;
    const role=document.getElementById('userRole').value;

    if(!name||!username||!password){ alert('أدخل الاسم واسم المستخدم وكلمة المرور'); return; }
    if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){
      alert('اسم المستخدم موجود بالفعل — اختر اسم مستخدم آخر');
      return;
    }

    const {id,seq} = nextId('u', state.users);
    state.users.push({
      id,_seq:seq,name,username,password,
      role,
      allowedTabs: role==='admin'? [] : [...draftUserAllowed]
    });
    draftUserAllowed = [];
    if(securityMode && securityToken){
      try{ const r=await apiRequest({action:'saveUsers',token:securityToken,users:state.users}); state.users=r.users||state.users; }catch(e){ alert(e.message||'تعذر حفظ المستخدم'); return; }
    }else await saveState();
    renderAll();
  });

  /* Settings */
  const mapAr=document.getElementById('mapAr'); if(mapAr) mapAr.addEventListener('change', async e=>{ state.settings.arAccountId=e.target.value; await saveState(); });
  const mapInv=document.getElementById('mapInv'); if(mapInv) mapInv.addEventListener('change', async e=>{ state.settings.inventoryAccountId=e.target.value; await saveState(); });
  const mapAp=document.getElementById('mapAp'); if(mapAp) mapAp.addEventListener('change', async e=>{ state.settings.apAccountId=e.target.value; await saveState(); });
  const mapRev=document.getElementById('mapRev'); if(mapRev) mapRev.addEventListener('change', async e=>{ state.settings.revenueAccountId=e.target.value; await saveState(); });
  const mapCogs=document.getElementById('mapCogs'); if(mapCogs) mapCogs.addEventListener('change', async e=>{ state.settings.cogsAccountId=e.target.value; await saveState(); });
  const mapCash=document.getElementById('mapCash'); if(mapCash) mapCash.addEventListener('change', async e=>{ state.settings.cashAccountId=e.target.value; await saveState(); });
  const mapPayroll=document.getElementById('mapPayroll'); if(mapPayroll) mapPayroll.addEventListener('change', async e=>{ state.settings.payrollExpenseAccountId=e.target.value; await saveState(); });
  const mapDepExp=document.getElementById('mapDepExp'); if(mapDepExp) mapDepExp.addEventListener('change', async e=>{ state.settings.depreciationExpenseAccountId=e.target.value; await saveState(); });
  const mapAccumDep=document.getElementById('mapAccumDep'); if(mapAccumDep) mapAccumDep.addEventListener('change', async e=>{ state.settings.accumDepreciationAccountId=e.target.value; await saveState(); });

  const initSecurityBtn=document.getElementById('initSecurityBtn');
  if(initSecurityBtn) initSecurityBtn.addEventListener('click', async ()=>{
    if(!syncUrl){alert('اربط Web App أولاً');return;}
    if(currentUser&&currentUser.role!=='admin'){alert('هذه العملية للمدير فقط');return;}
    try{
      const r=await apiRequest({action:'init',users:state.users});
      if(r.status!=='ok') throw new Error(r.message||'فشل تهيئة الأمان');
      await persistSecurityToken(r.token||''); securityMode=true; currentUser=r.user||currentUser;
      const gu=await apiRequest({action:'getUsers',token:securityToken}); state.users=gu.users||[];
      await persistSetupDone();
      await pushToSheet();
      alert('تمت تهيئة الأمان. من الآن الدخول والصلاحيات تتم من الخادم.');
      renderAll();
    }catch(e){alert(e.message||'حدث خطأ');}
  });
  const saveSyncUrlBtn = document.getElementById('saveSyncUrlBtn');
  if(saveSyncUrlBtn) saveSyncUrlBtn.addEventListener('click', async ()=>{
    const val = document.getElementById('syncUrlInput').value.trim();
    if(!val){ alert('الصق رابط الويب أب أولاً'); return; }
    syncUrl=val; await persistSyncUrl(syncUrl);
    try{ const h=await fetch(syncUrl+(syncUrl.includes('?')?'&':'?')+'action=health&t='+Date.now()); const hr=await h.json();
      if(hr.initialized){ securityMode=true; syncStatus={state:'empty',message:'الخادم مؤمّن — سجل الدخول بحسابك',time:''}; }
      else { securityMode=false; syncStatus={state:'empty',message:'الخادم جاهز — سجّل الدخول ثم استخدم تهيئة الأمان مرة واحدة.',time:''}; }
    }catch(e){syncStatus={state:'error',message:'تعذر الاتصال بالـ Web App',time:''};}
    ensureSettings(); renderAll();
  });
  const pullSyncBtn = document.getElementById('pullSyncBtn');
  if(pullSyncBtn) pullSyncBtn.addEventListener('click', async ()=>{
    if(!syncUrl){ alert('اربط رابط الشيت الأول'); return; }
    if(!confirm('هيتم استبدال البيانات الحالية ببيانات الشيت، متابعة؟')) return;
    const pulled = await pullFromSheet();
    if(pulled){ ensureSettings(); renderAll(); } else alert('لم يتم العثور على بيانات أو حدث خطأ في الاتصال');
  });
  const pushSyncBtn = document.getElementById('pushSyncBtn');
  if(pushSyncBtn) pushSyncBtn.addEventListener('click', async ()=>{ if(!syncUrl){ alert('اربط رابط الشيت الأول'); return; } await pushToSheet(); });
  const disconnectSyncBtn = document.getElementById('disconnectSyncBtn');
  if(disconnectSyncBtn) disconnectSyncBtn.addEventListener('click', async ()=>{
    if(!confirm('تأكيد إلغاء الربط؟')) return;
    syncUrl=''; await persistSyncUrl(''); syncStatus={state:'idle',message:'',time:''}; renderAll();
  });
  const copyScriptBtn = document.getElementById('copyScriptBtn');
  if(copyScriptBtn) copyScriptBtn.addEventListener('click', ()=>{
    const ta = document.getElementById('appsScriptCode');
    const done = ()=>{ copyScriptBtn.textContent='✓ تم النسخ'; setTimeout(()=>{ copyScriptBtn.textContent='نسخ الكود'; },1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(APPS_SCRIPT_CODE).then(done).catch(()=>{ ta.select(); document.execCommand('copy'); done(); }); }
    else { ta.select(); document.execCommand('copy'); done(); }
  });
}

/* ================================================================
   INIT
   ================================================================ */
(async function init(){
  setupDelegatedActions();

  // أولاً نحمّل البيانات المحلية، حتى لا نفقد المستخدمين الموجودين من النسخ السابقة.
  await loadState();

  syncUrl=await loadSyncUrl();
  securityToken=await loadSecurityToken();

  // إذا كانت هناك جلسة أمنية محفوظة، نحاول استعادتها.
  if(syncUrl && securityToken){
    try{
      const r=await apiRequest({action:'getState',token:securityToken});
      if(r.status==='ok'){
        securityMode=true;
        currentUser=r.user;
        state=Object.assign(JSON.parse(JSON.stringify(EMPTY_STATE)),r.data||{});
        if(currentUser && currentUser.role==='admin'){
          const gu=await apiRequest({action:'getUsers',token:securityToken});
          state.users=gu.users||[];
        }
        await persistSetupDone();
        ensureSettings();
        renderAll();
        return;
      }
    }catch(e){
      await persistSecurityToken('');
      securityMode=false;
    }
  }

  ensureSettings();
  showLoginGate();
})();;
</script>

<script id="requested-upgrades-js">
(function(){
  // اسم بارامتر مميز وصعب نسخه غلط بدل "mode=user" اللي ممكن يتنسخ بسهولة
  // ويفضل عالق في تاريخ المتصفح أو التبويبات المفتوحة.
  const params = new URLSearchParams(location.search);
  const USER_MODE = params.get('portal') === 'employee' || params.get('mode') === 'user';

  /* ---------- User portal ---------- */
  function forceUserPortal(){
    if(!USER_MODE) return;
    // حماية أساسية: لو المستخدم المسجّل دخوله فعليًا هو مسؤول (admin)، وضع
    // "رابط الموظف" ميتفعّلش خالص حتى لو الرابط فيه البارامتر — عشان
    // المسؤول ميتفاجئش باختفاء الإعدادات لمجرد إنه فتح الرابط ده بالغلط.
    const isRealAdmin = ()=> window.currentUser && window.currentUser.role==='admin';

    // Hide admin-only navigation and settings/users, لكن فقط لو مش مسؤول فعلي.
    const hide = ()=>{
      if(isRealAdmin()){
        // رجّع أي عناصر كانت اتخفت قبل ما نكتشف إنه مسؤول فعلي (حالة تسجيل الدخول بعد فتح الصفحة).
        document.querySelectorAll('[data-tab="users"],[data-tab="settings"],#usersTab,#settingsTab')
          .forEach(x=>{ if(x.style.display==='none') x.style.display=''; });
        return;
      }
      document.querySelectorAll('[data-tab="users"],[data-tab="settings"],#usersTab,#settingsTab')
        .forEach(x=>x.style.display='none');
      // Any common labels/buttons for user administration.
      document.querySelectorAll('button,a').forEach(x=>{
        const t=(x.textContent||'').trim();
        if(/المستخدمون|إدارة المستخدمين|الإعدادات والمزامنة/.test(t)){
          x.style.display='none';
        }
      });
    };
    hide();
    new MutationObserver(hide).observe(document.body,{subtree:true,childList:true});
  }

  /* ---------- GLOBAL SEARCHABLE SELECTS ---------- */
  function makeSelectSearchable(select){
    if(!select || select.dataset.dsSearch==='1' || select.dataset.noSearch==='1') return;

    const opts=[...select.options];
    // Only skip empty / tiny controls. Any real entity list is searchable.
    const usable=opts.filter(o=>String(o.value||'').trim()!=='');
    if(usable.length < 2) return;

    select.dataset.dsSearch='1';

    const wrap=document.createElement('div');
    wrap.className='ds-search-wrap';

    const input=document.createElement('input');
    input.type='text';
    input.className='ds-search-input';
    input.placeholder='اكتب جزء من الاسم أو الكود للبحث…';
    input.autocomplete='off';
    input.setAttribute('aria-label','بحث داخل الاختيارات');

    const menu=document.createElement('div');
    menu.className='ds-search-menu';
    menu.style.display='none';

    select.parentNode.insertBefore(wrap,select);
    wrap.appendChild(input);
    wrap.appendChild(menu);
    wrap.appendChild(select);
    select.style.display='none';

    function syncInput(){
      const o=select.options[select.selectedIndex];
      input.value=(o && o.value) ? o.textContent : '';
    }

    function render(q){
      q=String(q||'').trim().toLowerCase();
      menu.innerHTML='';
      let count=0;

      [...select.options].forEach((o,i)=>{
        const value=String(o.value||'');
        const label=String(o.textContent||'');
        if(!value) return;

        // Search both Arabic/English names, codes, IDs, and the full label.
        const hay=(label+' '+value).toLowerCase();
        if(q && !hay.includes(q)) return;

        const b=document.createElement('button');
        b.type='button';
        b.className='ds-search-option';
        b.textContent=label;
        b.onclick=function(){
          select.value=value;
          input.value=label;
          menu.style.display='none';

          // Preserve the original application's handlers.
          select.dispatchEvent(new Event('change',{bubbles:true}));
          select.dispatchEvent(new Event('input',{bubbles:true}));
        };
        menu.appendChild(b);
        count++;
      });

      if(!count){
        menu.innerHTML='<div class="ds-search-empty">لا توجد نتائج مطابقة</div>';
      }
      menu.style.display='block';
    }

    input.addEventListener('focus',()=>render(input.value));
    input.addEventListener('input',()=>render(input.value));
    input.addEventListener('keydown',e=>{
      if(e.key==='Escape') menu.style.display='none';
    });

    select.addEventListener('change',syncInput);

    // Keep the dropdown closed when clicking outside it.
    document.addEventListener('click',e=>{
      if(!wrap.contains(e.target)) menu.style.display='none';
    });

    syncInput();
  }

  function enhanceAllSelects(){
    // Intentionally global: accounts, customers, suppliers, items, employees,
    // banks, cash, warehouses, projects, payment methods, etc.
    document.querySelectorAll('select').forEach(makeSelectSearchable);
  }

  function installGlobalSearch(){
    enhanceAllSelects();
    // Every module is rendered dynamically, so observe the page and enhance
    // newly-created selects as soon as they appear.
    if(!window.__globalSelectObserver){
      window.__globalSelectObserver=new MutationObserver(()=>enhanceAllSelects());
      window.__globalSelectObserver.observe(document.body,{subtree:true,childList:true});
    }
  }

  /* ---------- Admin user editor ---------- */
  function installUserEditor(){
    if(USER_MODE) return;

    const scan=()=>{
      // Add an Edit button to every user row that contains a delete button.
      document.querySelectorAll('[data-del-user]').forEach(del=>{
        const row=del.closest('tr');
        if(!row || row.querySelector('[data-ds-edit-user]')) return;
        const id=del.getAttribute('data-del-user');
        const b=document.createElement('button');
        b.type='button';
        b.className='btn btn-outline btn-sm';
        b.textContent='تعديل';
        b.setAttribute('data-ds-edit-user',id);
        del.parentNode.insertBefore(b,del);
        del.parentNode.insertBefore(document.createTextNode(' '),del);
      });
    };

    document.addEventListener('click',async e=>{
      const b=e.target.closest('[data-ds-edit-user]');
      if(!b) return;
      const id=b.getAttribute('data-ds-edit-user');
      const users=(window.state && window.state.users)||[];
      const u=users.find(x=>String(x.id)===String(id));
      if(!u){ alert('لم يتم العثور على المستخدم'); return; }

      const name=prompt('اسم المستخدم/الموظف:',u.name||'');
      if(name===null) return;
      const username=prompt('اسم الدخول (Username):',u.username||'');
      if(username===null) return;
      const password=prompt('كلمة المرور الجديدة (اتركها فارغة بدون تغيير):','');
      if(username.trim()!==u.username &&
         users.some(x=>x!==u && String(x.username||'').toLowerCase()===username.trim().toLowerCase())){
        alert('اسم المستخدم موجود بالفعل');
        return;
      }

      u.name=name.trim();
      u.username=username.trim();
      if(password!=='') u.password=password;

      try{
        if(typeof window.saveState==='function') await window.saveState();
        if(typeof window.renderAll==='function') window.renderAll();
        alert('تم تعديل بيانات المستخدم.');
      }catch(err){
        alert('تعذر حفظ التعديل: '+(err.message||err));
      }
    });

    scan();
    new MutationObserver(scan).observe(document.body,{subtree:true,childList:true});
  }

  /* ---------- Admin: copy user link ---------- */
  function installUserLinkButton(){
    if(USER_MODE) return;
    const scan=()=>{
      // Put button next to the users/settings area, without depending on a
      // specific function name in the original program.
      const candidates=[...document.querySelectorAll('button')].filter(b=>/حفظ وربط|المستخدمون|المستخدمين/.test(b.textContent||''));
      const host=candidates.find(x=>/حفظ وربط/.test(x.textContent||'')) || candidates.find(x=>/المستخدمون|المستخدمين/.test(x.textContent||''));
      if(!host || document.getElementById('dsCopyUserLink')) return;

      const b=document.createElement('button');
      b.id='dsCopyUserLink';
      b.className='btn btn-outline';
      b.textContent='🔗 نسخ رابط المستخدم';
      b.onclick=async()=>{
        const u=new URL(location.href);
        u.searchParams.set('portal','employee');
        try{
          await navigator.clipboard.writeText(u.toString());
          alert('تم نسخ رابط المستخدم. أرسله للموظف.');
        }catch(e){
          prompt('انسخ الرابط:',u.toString());
        }
      };
      host.parentNode.appendChild(b);
    };
    scan();
    new MutationObserver(scan).observe(document.body,{subtree:true,childList:true});
  }

  function boot(){
    forceUserPortal();
    installGlobalSearch();
    installUserEditor();
    installUserLinkButton();

    // Re-enhance after every render.
    new MutationObserver(()=>enhanceAllSelects()).observe(document.body,{subtree:true,childList:true});
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
