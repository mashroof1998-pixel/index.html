<style>
:root{
  --ink:#12213a; --ink-2:#1b2f52; --ink-3:#233a63;
  --paper:#f6f1e4; --paper-2:#efe8d6; --rule:#d8cfb2;
  --brass:#b6905a; --brass-light:#e4c793;
  --forest:#2c6b4d; --forest-light:#e3efe6;
  --rust:#a3402f; --rust-light:#f6e4e0;
  --text:#20242f; --muted:#756f5c; --paper-text:#2a2517;
  --accent2:#5b6fa8; --accent2-light:#e6e9f5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  background-image: radial-gradient(circle at 15% 10%, rgba(182,144,90,0.08), transparent 45%), radial-gradient(circle at 85% 90%, rgba(182,144,90,0.06), transparent 40%);
  color:var(--paper); font-family:'Tajawal',sans-serif; min-height:100vh; display:flex; flex-direction:column;
}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;}
.app{display:flex;flex:1;min-height:100vh;}
.sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--ink-2),var(--ink));border-left:1px solid rgba(182,144,90,0.25);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:0.28rem;overflow-y:auto;}
.brand{font-weight:900;font-size:1.4rem;color:var(--brass-light);margin-bottom:0.1rem;letter-spacing:0.02em;}
.brand-sub{font-size:0.68rem;color:rgba(246,241,228,0.5);margin-bottom:1rem;letter-spacing:0.05em;}
.nav-group-label{font-size:0.64rem;color:rgba(246,241,228,0.4);text-transform:uppercase;letter-spacing:0.07em;margin:0.8rem 0 0.2rem;padding:0 0.65rem;}
.nav-group-label:first-of-type{margin-top:0;}
.nav-btn{display:flex;align-items:center;gap:0.55rem;background:transparent;border:none;color:rgba(246,241,228,0.75);text-align:right;padding:0.55rem 0.7rem;border-radius:8px;font-family:inherit;font-size:0.85rem;font-weight:500;cursor:pointer;transition:background .15s, color .15s;}
.nav-btn:hover{background:rgba(182,144,90,0.12);color:var(--paper);}
.nav-btn.active{background:rgba(182,144,90,0.22);color:var(--brass-light);font-weight:700;}
.nav-icon{width:1rem;text-align:center;opacity:0.85;}
.main{flex:1;padding:1.5rem 2rem 3rem;min-width:0;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.1rem;flex-wrap:wrap;gap:0.5rem;}
.page-head h1{font-size:1.35rem;font-weight:800;color:var(--brass-light);margin:0;}
.page-head p{color:rgba(246,241,228,0.55);font-size:0.83rem;margin:0.15rem 0 0;}
.card{background:var(--paper);color:var(--paper-text);border:1px solid var(--rule);border-radius:10px;padding:1.25rem 1.35rem;margin-bottom:1.2rem;box-shadow:0 6px 18px rgba(0,0,0,0.18);}
.card h2{font-size:0.98rem;font-weight:800;margin:0 0 0.85rem;color:var(--paper-text);border-bottom:2px solid var(--brass);padding-bottom:0.5rem;}
.card h2 small{font-weight:500;color:var(--muted);font-size:0.73rem;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.9rem;margin-bottom:1.2rem;}
.stat-card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:0.9rem 1.1rem;box-shadow:0 6px 18px rgba(0,0,0,0.18);color:var(--paper-text);border-top:3px solid var(--brass);}
.stat-card .lbl{font-size:0.74rem;color:var(--muted);margin-bottom:0.3rem;}
.stat-card .val{font-size:1.25rem;font-weight:700;}
.stat-card.pos{border-top-color:var(--forest);} .stat-card.neg{border-top-color:var(--rust);}
.stat-card.pos .val{color:var(--forest);} .stat-card.neg .val{color:var(--rust);}
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:1.2rem;margin-bottom:1.2rem;}
.chart-grid .card{margin-bottom:0;}
@media (max-width:900px){.chart-grid{grid-template-columns:1fr;}}
.chart-wrap{position:relative;height:260px;}
table.ledger{width:100%;border-collapse:collapse;font-size:0.88rem;}
table.ledger thead th{text-align:right;font-size:0.71rem;text-transform:uppercase;letter-spacing:0.03em;color:var(--muted);border-bottom:2px solid var(--brass);padding:0.48rem 0.5rem;font-weight:700;}
table.ledger tbody td{padding:0.48rem 0.5rem;background-image:linear-gradient(var(--rule) 1px, transparent 1px);background-position:0 100%;background-size:100% 1px;background-repeat:no-repeat;vertical-align:middle;}
table.ledger tbody tr:hover td{background-color:rgba(182,144,90,0.08);}
table.ledger td.num, table.ledger th.num{text-align:left;}
table.ledger tfoot td{font-weight:700;border-top:2px solid var(--brass);padding:0.55rem;}
.chip{display:inline-block;padding:0.14rem 0.5rem;border-radius:999px;font-size:0.68rem;font-weight:700;}
.chip.debit-normal{background:var(--forest-light);color:var(--forest);}
.chip.credit-normal{background:#e5e0f2;color:#4a3b8a;}
.chip.low{background:var(--rust-light);color:var(--rust);}
label{display:block;font-size:0.75rem;color:var(--muted);margin-bottom:0.22rem;font-weight:700;}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=password],select,textarea.field{width:100%;padding:0.48rem 0.6rem;border:1px solid var(--rule);border-radius:6px;background:#fffdf7;color:var(--paper-text);font-family:inherit;font-size:0.86rem;}
input:focus,select:focus{outline:2px solid var(--brass);outline-offset:1px;}
.form-row{display:grid;gap:0.85rem;margin-bottom:0.85rem;}
.form-grid-5{grid-template-columns:repeat(5,1fr);} .form-grid-4{grid-template-columns:repeat(4,1fr);}
.form-grid-3{grid-template-columns:repeat(3,1fr);} .form-grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:900px){.form-grid-5,.form-grid-4,.form-grid-3,.form-grid-2{grid-template-columns:1fr 1fr;}}
@media (max-width:600px){.form-grid-5,.form-grid-4,.form-grid-3,.form-grid-2{grid-template-columns:1fr;}}
.btn{border:none;border-radius:7px;padding:0.52rem 1.05rem;font-family:inherit;font-weight:700;font-size:0.84rem;cursor:pointer;transition:transform .1s, opacity .15s;}
.btn:active{transform:scale(0.97);}
.btn-brass{background:var(--brass);color:#fff;} .btn-brass:hover{opacity:0.9;}
.btn-outline{background:transparent;border:1px solid var(--rule);color:var(--paper-text);} .btn-outline:hover{background:var(--paper-2);}
.btn-danger{background:transparent;color:var(--rust);border:1px solid var(--rust);} .btn-danger:hover{background:var(--rust-light);}
.btn-sm{padding:0.28rem 0.6rem;font-size:0.73rem;}
.btn[disabled]{opacity:0.5;cursor:not-allowed;}
.jl-table{width:100%;border-collapse:collapse;margin-bottom:0.8rem;}
.jl-table th{font-size:0.69rem;color:var(--muted);text-align:right;padding:0.28rem 0.4rem;}
.jl-table td{padding:0.28rem 0.4rem;}
.jl-totals{display:flex;gap:1.4rem;justify-content:flex-start;align-items:center;padding:0.55rem;background:var(--paper-2);border-radius:8px;margin-bottom:0.85rem;flex-wrap:wrap;}
.jl-totals .t{font-size:0.83rem;} .jl-totals .t b{font-weight:700;}
.balance-tag{padding:0.24rem 0.68rem;border-radius:999px;font-weight:700;font-size:0.76rem;}
.balance-tag.ok{background:var(--forest-light);color:var(--forest);}
.balance-tag.bad{background:var(--rust-light);color:var(--rust);}
.entry-block{border:1px solid var(--rule);border-radius:8px;margin-bottom:0.75rem;overflow:hidden;}
.entry-block .eh{display:flex;justify-content:space-between;align-items:center;background:var(--paper-2);padding:0.5rem 0.85rem;font-size:0.82rem;flex-wrap:wrap;gap:0.4rem;}
.entry-block .eh .no{font-weight:800;color:var(--brass);}
.entry-block table{width:100%;border-collapse:collapse;font-size:0.82rem;}
.entry-block table td{padding:0.38rem 0.85rem;border-top:1px solid var(--rule);}
.empty-state{padding:1.8rem 1rem;text-align:center;color:var(--muted);font-size:0.88rem;}
.badge-type{font-size:0.68rem;color:var(--muted);}
.badge-auto{font-size:0.66rem;color:var(--brass);border:1px solid var(--brass);border-radius:999px;padding:0.08rem 0.45rem;}
.note{font-size:0.77rem;color:var(--muted);margin-top:0.5rem;line-height:1.6;}
.progress-bar{height:8px;border-radius:999px;background:var(--paper-2);overflow:hidden;}
.progress-bar > div{height:100%;border-radius:999px;}
.search-box{margin-bottom:0.8rem;max-width:340px;}
.search-box input{padding-inline-start:2rem;background-image:none;}
::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:rgba(182,144,90,0.4);border-radius:6px;}
.sync-badge{margin-top:auto;padding-top:0.8rem;font-size:0.7rem;color:rgba(246,241,228,0.55);border-top:1px solid rgba(182,144,90,0.2);line-height:1.6;}
textarea.code-box{width:100%;min-height:220px;font-family:'IBM Plex Mono',monospace;font-size:0.73rem;padding:0.7rem;border:1px solid var(--rule);border-radius:6px;background:#fffdf7;color:var(--paper-text);direction:ltr;text-align:left;resize:vertical;}
.step-list{padding-inline-start:1.2rem;line-height:1.9;font-size:0.85rem;}
.link-btn{background:none;border:none;color:var(--brass);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:0.82rem;padding:0;}
.perm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.3rem 1rem;margin-top:0.5rem;}
@media (max-width:700px){.perm-grid{grid-template-columns:1fr 1fr;}}
.perm-item{display:flex;align-items:center;gap:0.4rem;font-size:0.82rem;}
#loginGate{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:999;}
#loginGate .box{background:var(--paper);color:var(--paper-text);border-radius:12px;padding:2rem;max-width:380px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,0.4);}
@media (max-width:760px){
  .app{flex-direction:column;} .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:0.8rem;border-left:none;border-bottom:1px solid rgba(182,144,90,0.25);}
  .brand,.brand-sub,.nav-group-label,.sync-badge{display:none;} .nav-btn{white-space:nowrap;} .main{padding:1rem;}
  .chart-grid{grid-template-columns:1fr;}
}
</style>

/* searchable dropdown */
.ds-search-wrap{position:relative;width:100%}

.ds-search-menu{position:absolute;z-index:99999;left:0;right:0;top:calc(100% + 3px);max-height:260px;overflow:auto;background:var(--paper,#fff);border:1px solid rgba(182,144,90,.55);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2)}

<body>
<div id="loginGate" style="display:none;"></div>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main"><div id="page"></div></div>
</div>

<script>
/* ================================================================
   STORAGE LAYER
   ================================================================ */
const hasStorage = typeof window.storage !== 'undefined';
const hasLocalStorage = typeof window.localStorage !== 'undefined';
const EMPTY_STATE = {accounts:[],entries:[],budgets:[],items:[],stockMovements:[],customers:[],suppliers:[],employees:[],payments:[],payrollSlips:[],assets:[],depreciationRuns:[],salesInvoices:[],purchaseInvoices:[],boms:[],productionOrders:[],users:[],settings:{}};
let state = JSON.parse(JSON.stringify(EMPTY_STATE));
// state بيتغيّر كتير (reassignment) طول الوقت، فبنعرضه بـ getter حي على
// window بدل ما نعتمد على نسخة قديمة منه — كود "تعديل المستخدم" وأي كود
// خارجي تاني بيقرأ window.state محتاج يشوف القيمة الحالية دايمًا.
Object.defineProperty(window,'state',{get:()=>state,configurable:true});
const STORE_KEY = 'accounting-data-v3';

async function loadState(){
  let loaded = false;
  if(hasStorage){
    try{
      const res = await window.storage.get(STORE_KEY, false);
      if(res && res.value){
        state = Object.assign(JSON.parse(JSON.stringify(EMPTY_STATE)), JSON.parse(res.value));
        loaded = true;
      }
    }catch(e){}
  }
  if(!loaded && hasLocalStorage){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){
        state = Object.assign(JSON.parse(JSON.stringify(EMPTY_STATE)), JSON.parse(raw));
        loaded = true;
      }
    }catch(e){}
  }
  if(!loaded){
    seedIfEmpty();
    await saveState();
  }
}
async function saveState(){
  const payload = JSON.stringify(state);
  if(hasStorage){ try{ await window.storage.set(STORE_KEY, payload, false); }catch(e){ console.error('storage error', e); } }
  if(hasLocalStorage){ try{ localStorage.setItem(STORE_KEY, payload); }catch(e){} }
  if(syncUrl){ pushToSheet(); }
}
function seedIfEmpty(){
  if(state.accounts.length) return;
  const defaults = [
    ['1000','النقدية','أصول'],['1010','البنك','أصول'],['1100','عملاء (مدينون)','أصول'],
    ['1200','مخزون','أصول'],['1250','مجمع إهلاك الأصول الثابتة','أصول'],
    ['2000','موردون (دائنون)','خصوم'],['2100','قروض','خصوم'],
    ['3000','رأس المال','حقوق الملكية'],['3100','أرباح مرحلة','حقوق الملكية'],
    ['4000','إيرادات المبيعات','إيرادات'],['5000','تكلفة المبيعات','مصروفات'],
    ['5100','مصروفات تشغيلية','مصروفات'],['5200','رواتب وأجور','مصروفات'],['5300','مصروف إهلاك','مصروفات'],
  ];
  state.accounts = defaults.map(([code,name,type],i)=>({id:'a'+(i+1),code,name,type,opening:0,_seq:i+1}));
  state.items = [
    {id:'it1',_seq:1,code:'RM-001',name:'خامة قماش',unit:'متر',type:'خامة',reorderLevel:50},
    {id:'it2',_seq:2,code:'FG-001',name:'قميص جاهز',unit:'قطعة',type:'منتج تام',reorderLevel:20},
  ];
  state.stockMovements = [{id:'m1',_seq:1,date:new Date().toISOString().slice(0,10),itemId:'it1',type:'opening',qty:100,unitCost:20,sourceId:null}];
  state.boms = [{id:'bom1',_seq:1,productItemId:'it2',components:[{itemId:'it1',qty:2}]}];
  ensureSettings();
}
function ensureSettings(){
  if(!state.settings) state.settings = {};
  const byCode = code => { const a = state.accounts.find(x=>x.code===code); return a?a.id:''; };
  const s = state.settings;
  if(!s.arAccountId || !accountById(s.arAccountId)) s.arAccountId = byCode('1100');
  if(!s.inventoryAccountId || !accountById(s.inventoryAccountId)) s.inventoryAccountId = byCode('1200');
  if(!s.apAccountId || !accountById(s.apAccountId)) s.apAccountId = byCode('2000');
  if(!s.revenueAccountId || !accountById(s.revenueAccountId)) s.revenueAccountId = byCode('4000');
  if(!s.cogsAccountId || !accountById(s.cogsAccountId)) s.cogsAccountId = byCode('5000');
  if(!s.cashAccountId || !accountById(s.cashAccountId)) s.cashAccountId = byCode('1000');
  if(!s.payrollExpenseAccountId || !accountById(s.payrollExpenseAccountId)) s.payrollExpenseAccountId = byCode('5200');
  if(!s.depreciationExpenseAccountId || !accountById(s.depreciationExpenseAccountId)) s.depreciationExpenseAccountId = byCode('5300');
  if(!s.accumDepreciationAccountId || !accountById(s.accumDepreciationAccountId)) s.accumDepreciationAccountId = byCode('1250');
}
function nextId(prefix, arr){
  const n = (arr.length ? Math.max(...arr.map(x=>x._seq||0)) : 0) + 1;
  return { id: prefix+n+'_'+Date.now().toString(36)+'_'+Math.floor(Math.random()*1000), seq:n };
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str==null? '' : String(str); return d.innerHTML; }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ================================================================
   GOOGLE SHEETS SYNC
   ================================================================ */
const DEFAULT_SYNC_URL = ''; // ضع هنا رابط /exec مرة واحدة إذا أردت أن تكون النسخة جاهزة للمستخدمين.
let syncUrl = '';
let securityToken = '';
let securityMode = false;
let syncStatus = {state:'idle', message:'', time:''};
const APPS_SCRIPT_CODE = `const DATA_SHEET='Data';
const USERS_SHEET='Users';
const SESSIONS_SHEET='Sessions';
const SETUP_PROP='SECURITY_INITIALIZED';
const SESSION_HOURS=12;

function doGet(e){ return handle_(e, null); }
function doPost(e){
  var body={};
  try{ body=JSON.parse((e.postData&&e.postData.contents)||'{}'); }catch(err){}
  return handle_(e, body);
}
function handle_(e, body){
  var action=(body&&body.action)||(e&&e.parameter&&e.parameter.action)||'health';
  try{
    if(action==='health') return out_({status:'ok',service:'Daftar Security API',version:3,initialized:isInitialized_()});
    if(action==='init') return initSecurity_(body);
    if(action==='login') return login_(body);
    if(action==='getState') return getState_(body);
    if(action==='saveState') return saveState_(body);
    if(action==='getUsers') return getUsers_(body);
    if(action==='saveUsers') return saveUsers_(body);
    if(action==='logout') return logout_(body);
    return out_({status:'error',message:'Unknown action'});
  }catch(err){
    return out_({status:'error',message:String(err&&err.message||err)});
  }
}
function out_(obj){
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
function ss_(){ return SpreadsheetApp.getActiveSpreadsheet(); }
function sheet_(name,headers){
  var ss=ss_(), sh=ss.getSheetByName(name);
  if(!sh) sh=ss.insertSheet(name);
  if(headers && sh.getLastRow()===0) sh.getRange(1,1,1,headers.length).setValues([headers]);
  return sh;
}
function isInitialized_(){ return PropertiesService.getScriptProperties().getProperty(SETUP_PROP)==='1'; }
function hash_(s){
  var bytes=Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,String(s),Utilities.Charset.UTF_8);
  return bytes.map(function(b){var v=b<0?b+256:b;return ('0'+v.toString(16)).slice(-2);}).join('');
}
function token_(){ return Utilities.getUuid().replace(/-/g,'')+Utilities.getUuid().replace(/-/g,''); }

function initSecurity_(body){
  if(isInitialized_()) return out_({status:'error',message:'الأمان مهيأ بالفعل'});
  if(!body || !Array.isArray(body.users) || !body.users.length) return out_({status:'error',message:'لا يوجد مستخدمون للتهيئة'});
  var admin=body.users.find(function(u){return u.role==='admin';});
  if(!admin || !admin.username || !(admin.password||admin.pin)) return out_({status:'error',message:'يجب وجود مستخدم مدير بكلمة مرور'});

  var sh=sheet_(USERS_SHEET,['id','name','username','passwordHash','role','allowedTabs','active']);
  if(sh.getLastRow()>1) sh.getRange(2,1,sh.getLastRow()-1,7).clearContent();

  var rows=body.users.map(function(u){
    var pw=u.password||u.pin||'';
    return [u.id||Utilities.getUuid(),u.name||'',String(u.username||'').toLowerCase(),hash_(pw),u.role||'custom',JSON.stringify(u.allowedTabs||[]),'1'];
  });
  sh.getRange(2,1,rows.length,7).setValues(rows);

  sheet_(DATA_SHEET,['section','payload','updatedAt']);
  PropertiesService.getScriptProperties().setProperty(SETUP_PROP,'1');

  var t=token_(), exp=new Date(Date.now()+SESSION_HOURS*3600000);
  sheet_(SESSIONS_SHEET,['token','username','expiresAt']).appendRow([t,String(admin.username).toLowerCase(),exp]);

  return out_({status:'ok',initialized:true,token:t,user:{id:admin.id||'',name:admin.name||'',username:String(admin.username||'').toLowerCase(),role:'admin',allowedTabs:[]}});
}

function userByToken_(token){
  if(!token) return null;
  var sh=sheet_(SESSIONS_SHEET,['token','username','expiresAt']);
  var vals=sh.getDataRange().getValues(), now=new Date().getTime();
  for(var i=1;i<vals.length;i++){
    if(String(vals[i][0])===String(token) && new Date(vals[i][2]).getTime()>now) return findUser_(String(vals[i][1]));
  }
  return null;
}
function findUser_(username){
  var sh=sheet_(USERS_SHEET,['id','name','username','passwordHash','role','allowedTabs','active']);
  var vals=sh.getDataRange().getValues();
  for(var i=1;i<vals.length;i++){

function login_(body){
  if(!isInitialized_()) return out_({status:'not_initialized'});
  var username=String(body.username||'').trim().toLowerCase(), password=String(body.password||'');
  var sh=sheet_(USERS_SHEET,['id','name','username','passwordHash','role','allowedTabs','active']);
  var vals=sh.getDataRange().getValues();
  for(var i=1;i<vals.length;i++){

function tabKeys_(tabs){
  var k={};
  function add(a){a.forEach(function(x){k[x]=true;});}
  if(tabs.indexOf('dashboard')>=0) add(['accounts','entries','items','stockMovements','customers','salesInvoices','settings']);
  if(tabs.indexOf('accounts')>=0) add(['accounts']);
  if(tabs.indexOf('journal')>=0||tabs.indexOf('ledger')>=0||tabs.indexOf('reports')>=0) add(['accounts','entries','settings']);
  if(tabs.indexOf('budget')>=0) add(['budgets','accounts','entries','settings']);
  if(tabs.indexOf('inventory')>=0||tabs.indexOf('manufacturing')>=0) add(['items','stockMovements','boms','productionOrders','accounts','entries','settings']);
  if(tabs.indexOf('sales')>=0) add(['salesInvoices','customers','items','stockMovements','accounts','entries','settings']);
  if(tabs.indexOf('customers')>=0) add(['customers','salesInvoices','accounts','entries']);
  if(tabs.indexOf('purchases')>=0) add(['purchaseInvoices','suppliers','items','stockMovements','accounts','entries','settings']);
  if(tabs.indexOf('suppliers')>=0) add(['suppliers','purchaseInvoices','accounts','entries']);
  if(tabs.indexOf('payments')>=0) add(['payments','customers','suppliers','accounts','entries','settings']);
  if(tabs.indexOf('assets')>=0) add(['assets','accounts','entries','settings']);
  if(tabs.indexOf('employees')>=0) add(['employees','payrollSlips','accounts','entries','settings']);
  return k;
}
function allowedTabs_(u){ return u.role==='admin'?['*']:(u.allowedTabs||[]); }
function canWriteKey_(u,key){
  if(u.role==='admin') return true;

  var tab=map[key];

function readState_(){
  var sh=sheet_(DATA_SHEET,['section','payload','updatedAt']);
  var vals=sh.getDataRange().getValues(), out={};
  for(var i=1;i<vals.length;i++){
    if(vals[i][0] && vals[i][0]!=='__meta'){
      try{ out[vals[i][0]]=JSON.parse(vals[i][1]||'null'); }catch(e){}
    }
  }

}
function writeState_(data){
  var sh=sheet_(DATA_SHEET,['section','payload','updatedAt']);
  var now=new Date();
  var rows=[['__meta',JSON.stringify({updatedAt:now.toISOString()}),now]];
  Object.keys(data||{}).forEach(function(k){if(k!=='users') rows.push([k,JSON.stringify(data[k]),now]);});

function filteredState_(full,u){

  var keys=tabKeys_(allowedTabs_(u)), out={};

function txt_(v){
  if(v===null||v===undefined) return '';

  if(/^[=+@]/.test(s)) return "'"+s;
  return s;
}
function num_(v){ var n=Number(v); return isNaN(n)?0:n; }
function nameById_(arr,id,field){
  for(var i=0;i<(arr||[]).length;i++) if(String(arr[i].id)===String(id)) return arr[i][field||'name']||'';
  return '';
}

function writeTable_(name,headers,rows,moneyCols,qtyCols){
  var sh=sheet_(name,headers);
  sh.clearContents();
  sh.getRange(1,1,1,headers.length).setValues([headers]);
  if(rows.length) sh.getRange(2,1,rows.length,headers.length).setValues(rows);
  sh.setFrozenRows(1);
  sh.getRange(1,1,1,headers.length).setFontWeight('bold');

  if(qtyCols) qtyCols.forEach(function(c){if(rows.length) sh.getRange(2,c,rows.length,1).setNumberFormat('#,##0.###');});

function getState_(body){

  if(!u) return out_({status:'unauthorized'});
  return out_({status:'ok',user:u,data:filteredState_(readState_(),u)});
}
function saveState_(body){
  var u=userByToken_(body&&body.token);
  if(!u) return out_({status:'unauthorized'});
  var incoming=body&&body.data;
  if(!incoming) return out_({status:'error',message:'لا توجد بيانات'});

  var full=readState_();
  Object.keys(incoming).forEach(function(k){
    if(k==='users') return;
    if(canWriteKey_(u,k)) full[k]=incoming[k];

  writeStructuredSheets_(full,u.username);

  return out_({status:'ok',user:u,data:filteredState_(full,u)});

function saveUsers_(body){

  if(!body.users.some(function(u){return u.role==='admin';})) return out_({status:'error',message:'يجب أن يبقى مستخدم مدير واحد على الأقل'});

  var sh=sheet_(USERS_SHEET,['id','name','username','passwordHash','role','allowedTabs','active']);
  var old=sh.getDataRange().getValues(), oldHash={};

    var pw=u.password||'', h=pw?hash_(pw):(oldHash[String(u.id)]||'');
    if(!h) throw new Error('المستخدم '+(u.username||'')+' يحتاج كلمة مرور');

function logout_(body){

  var sh=sheet_(SESSIONS_SHEET,['token','username','expiresAt']);
  var vals=sh.getDataRange().getValues();
  for(var i=vals.length-1;i>=1;i--) if(String(vals[i][0])===String(token)) sh.deleteRow(i+1);

async function apiRequest(payload){

  const res=await fetch(syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  const text=await res.text();
  let data; try{data=JSON.parse(text);}catch(e){throw new Error('الرد من الخادم ليس JSON');}
  if(data.status==='unauthorized') throw new Error('انتهت جلسة الدخول — سجل الدخول مرة أخرى');

  syncStatus={state:'syncing',message:'',time:''}; updateSyncStatusUI();
  try{
    if(securityMode && securityToken){
      const data=await apiRequest({action:'saveState',token:securityToken,data:state});
      if(data.data) state=Object.assign(JSON.parse(JSON.stringify(EMPTY_STATE)),data.data);
    }else{
      const res=await fetch(syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'legacySave',data:state})});
      const parsed=JSON.parse(await res.text());
      if(parsed.status!=='ok') throw new Error(parsed.message||'فشل الحفظ');
    }
    syncStatus={state:'ok',message:'',time:new Date().toLocaleTimeString('ar-EG')};
  }catch(e){syncStatus={state:'error',message:e.message||'تعذر الحفظ',time:''};}
  updateSyncStatusUI();
}
async function pullFromSheet(){
  if(!syncUrl) return false;
  syncStatus={state:'syncing',message:'',time:''}; updateSyncStatusUI();

    if(securityMode && securityToken){
      const data=await apiRequest({action:'getState',token:securityToken});

    }

/* ================================================================
   ACCOUNTING DOMAIN
   ================================================================ */
const NORMAL = { 'أصول':'debit', 'مصروفات':'debit', 'خصوم':'credit', 'حقوق الملكية':'credit', 'إيرادات':'credit' };
const TYPE_ORDER = ['أصول','خصوم','حقوق الملكية','إيرادات','مصروفات'];
function accountById(id){ return state.accounts.find(a=>a.id===id); }
function accountMovementInRange(accountId, from, to){
  let debit=0, credit=0;
  state.entries.forEach(e=>{
    if(from && e.date<from) return; if(to && e.date>to) return;
    e.lines.forEach(l=>{ if(l.accountId===accountId){ debit+=Number(l.debit)||0; credit+=Number(l.credit)||0; } });
  });
  return {debit,credit};
}
function accountBalanceAsOf(acc, asOf){
  const {debit,credit} = accountMovementInRange(acc.id, '', asOf||'');
  const normal = NORMAL[acc.type];
  return (Number(acc.opening)||0) + (normal==='debit'?(debit-credit):(credit-debit));
}
function accountMovementNet(acc, from, to){
  const {debit,credit} = accountMovementInRange(acc.id, from||'', to||'');
  const normal = NORMAL[acc.type];
  return normal==='debit'?(debit-credit):(credit-debit);
}
function accountBalance(acc){ return accountBalanceAsOf(acc, ''); }
function sumByType(type){ return state.accounts.filter(a=>a.type===type).reduce((s,a)=>s+accountBalance(a),0); }
function isEntryBalanced(lines){
  const d = lines.reduce((s,l)=>s+(Number(l.debit)||0),0), c = lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  return Math.abs(d-c) < 0.005 && d>0;
}

/* ================================================================
   INVENTORY DOMAIN
   ================================================================ */
function itemById(id){ return state.items.find(i=>i.id===id); }
const MOVE_LABELS = {opening:'رصيد افتتاحي', purchase:'شراء', sale:'بيع', production_in:'إنتاج (وارد)', production_out:'إنتاج (منصرف)'};
function replayItem(itemId){
  const moves = state.stockMovements.filter(m=>m.itemId===itemId).sort((a,b)=> a.date.localeCompare(b.date) || (a._seq-b._seq));
  let qty=0, avgCost=0; const costOf={};
  moves.forEach(m=>{
    if(m.type==='opening'||m.type==='purchase'||m.type==='production_in'){
      const newQty = qty + Number(m.qty);
      const totalVal = qty*avgCost + Number(m.qty)*(Number(m.unitCost)||0);
      avgCost = newQty>0 ? totalVal/newQty : 0; qty = newQty;
    } else { costOf[m.id] = Number(m.qty)*avgCost; qty -= Number(m.qty); }
  });
  return {qty, avgCost, costOf, moves};
}
function itemQty(itemId){ return replayItem(itemId).qty; }
function itemAvgCost(itemId){ return replayItem(itemId).avgCost; }
function itemStockValue(itemId){ const r=replayItem(itemId); return r.qty*r.avgCost; }
function totalInventoryValue(){ return state.items.reduce((s,it)=>s+itemStockValue(it.id),0); }
function itemBalanceAsOf(itemId, asOf){
  const moves = state.stockMovements.filter(m=>m.itemId===itemId && (!asOf || m.date<=asOf)).sort((a,b)=>a.date.localeCompare(b.date)||a._seq-b._seq);
  let qty=0, avgCost=0;
  moves.forEach(m=>{
    if(m.type==='opening'||m.type==='purchase'||m.type==='production_in'){
      const newQty=qty+Number(m.qty); const totalVal=qty*avgCost+Number(m.qty)*(Number(m.unitCost)||0);
      avgCost=newQty>0?totalVal/newQty:0; qty=newQty;
    } else { qty-=Number(m.qty); }
  });
  return {qty, avgCost, value: qty*avgCost};
}
function itemMovementInRange(itemId, from, to){
  let inQty=0,inValue=0,outQty=0,outValue=0;
  const r = replayItem(itemId);
  r.moves.forEach(m=>{
    if(from && m.date<from) return; if(to && m.date>to) return;
    if(m.type==='opening'||m.type==='purchase'||m.type==='production_in'){ inQty+=Number(m.qty); inValue+=Number(m.qty)*(Number(m.unitCost)||0); }
    else { outQty+=Number(m.qty); outValue+=(r.costOf[m.id]||0); }
  });
  return {inQty,inValue,outQty,outValue};
}
function dayBefore(dateStr){ if(!dateStr) return ''; const d=new Date(dateStr); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }

async function createSalesInvoice(customerId, date, lines){
  const total = round2(lines.reduce((s,l)=> s + Number(l.qty)*Number(l.price), 0));
  const {id:invoiceId, seq:invSeq} = nextId('si', state.salesInvoices);
  const movementIds = [];
  lines.forEach(l=>{ const {id:mid, seq:mseq} = nextId('m', state.stockMovements); state.stockMovements.push({id:mid,_seq:mseq,date,itemId:l.itemId,type:'sale',qty:Number(l.qty),unitCost:null,sourceId:invoiceId}); movementIds.push(mid); });
  let cogs = 0;
  [...new Set(lines.map(l=>l.itemId))].forEach(itemId=>{ const r = replayItem(itemId); movementIds.forEach(mid=>{ if(r.costOf[mid]!==undefined) cogs += r.costOf[mid]; }); });
  cogs = round2(cogs);
  const arAcc = accountById(state.settings.arAccountId), revAcc = accountById(state.settings.revenueAccountId);
  const invAcc = accountById(state.settings.inventoryAccountId), cogsAcc = accountById(state.settings.cogsAccountId);
  let entryId = null;
  if(arAcc && revAcc){
    const jlines = [ {accountId:arAcc.id, debit: total, credit:0}, {accountId:revAcc.id, debit:0, credit: total} ];
    if(cogs>0 && invAcc && cogsAcc){ jlines.push({accountId:cogsAcc.id, debit: cogs, credit:0}); jlines.push({accountId:invAcc.id, debit:0, credit: cogs}); }
    const {id:eid, seq:eseq} = nextId('e', state.entries);
    state.entries.push({id:eid,_seq:eseq,no:eseq,date,desc:'قيد آلي — فاتورة مبيعات رقم '+invSeq,lines:jlines,auto:true,source:'sales',sourceId:invoiceId});
    entryId = eid;
  }
  state.salesInvoices.push({id:invoiceId,_seq:invSeq,no:invSeq,date,customerId,lines,entryId,cogs,total});
  await saveState();
}
async function deleteSalesInvoice(invId){
  const inv = state.salesInvoices.find(i=>i.id===invId); if(!inv) return;
  state.stockMovements = state.stockMovements.filter(m=>m.sourceId!==invId);
  if(inv.entryId) state.entries = state.entries.filter(e=>e.id!==inv.entryId);
  state.salesInvoices = state.salesInvoices.filter(i=>i.id!==invId);
  await saveState();
}
async function createPurchaseInvoice(supplierId, date, lines){
  const total = round2(lines.reduce((s,l)=> s+Number(l.qty)*Number(l.cost), 0));
  const {id:invoiceId, seq:invSeq} = nextId('pi', state.purchaseInvoices);
  lines.forEach(l=>{ const {id:mid, seq:mseq} = nextId('m', state.stockMovements); state.stockMovements.push({id:mid,_seq:mseq,date,itemId:l.itemId,type:'purchase',qty:Number(l.qty),unitCost:Number(l.cost),sourceId:invoiceId}); });
  const apAcc = accountById(state.settings.apAccountId), invAcc = accountById(state.settings.inventoryAccountId);
  let entryId = null;
  if(apAcc && invAcc){
    const jlines = [ {accountId:invAcc.id, debit: total, credit:0}, {accountId:apAcc.id, debit:0, credit: total} ];
    const {id:eid, seq:eseq} = nextId('e', state.entries);
    state.entries.push({id:eid,_seq:eseq,no:eseq,date,desc:'قيد آلي — فاتورة مشتريات رقم '+invSeq,lines:jlines,auto:true,source:'purchase',sourceId:invoiceId});
    entryId = eid;
  }
  state.purchaseInvoices.push({id:invoiceId,_seq:invSeq,no:invSeq,date,supplierId,lines,entryId,total});
  await saveState();
}
async function deletePurchaseInvoice(id){
  const inv = state.purchaseInvoices.find(i=>i.id===id); if(!inv) return;
  state.stockMovements = state.stockMovements.filter(m=>m.sourceId!==id);
  if(inv.entryId) state.entries = state.entries.filter(e=>e.id!==inv.entryId);
  state.purchaseInvoices = state.purchaseInvoices.filter(i=>i.id!==id);
  await saveState();
}
async function createProductionOrder(bomId, qtyProduced, date){
  const bom = state.boms.find(b=>b.id===bomId); if(!bom) return null;
  const {id:orderId, seq:orderSeq} = nextId('po', state.productionOrders);
  const movementIds = [];
  bom.components.forEach(c=>{ const consumeQty = round2(Number(c.qty)*Number(qtyProduced)); const {id:mid,seq:mseq} = nextId('m', state.stockMovements); state.stockMovements.push({id:mid,_seq:mseq,date,itemId:c.itemId,type:'production_out',qty:consumeQty,unitCost:null,sourceId:orderId}); movementIds.push(mid); });
  let totalCost = 0;
  [...new Set(bom.components.map(c=>c.itemId))].forEach(itemId=>{ const r = replayItem(itemId); movementIds.forEach(mid=>{ if(r.costOf[mid]!==undefined) totalCost += r.costOf[mid]; }); });
  totalCost = round2(totalCost);
  const unitCost = qtyProduced>0 ? totalCost/qtyProduced : 0;
  const {id:mid2,seq:mseq2} = nextId('m', state.stockMovements);
  state.stockMovements.push({id:mid2,_seq:mseq2,date,itemId:bom.productItemId,type:'production_in',qty:Number(qtyProduced),unitCost:round2(unitCost),sourceId:orderId});
  movementIds.push(mid2);
  state.productionOrders.push({id:orderId,_seq:orderSeq,no:orderSeq,date,bomId,qtyProduced:Number(qtyProduced),cost:totalCost,movementIds});
  await saveState(); return orderId;
}
async function deleteProductionOrder(id){
  state.stockMovements = state.stockMovements.filter(m=>m.sourceId!==id);
  state.productionOrders = state.productionOrders.filter(o=>o.id!==id);
  await saveState();
}

async function createPayment(p){
  const {id,seq} = nextId('pay', state.payments);
  let entryId=null;
  const cashAcc = accountById(p.cashAccountId), counterAcc = accountById(p.counterAccountId);
  if(cashAcc && counterAcc){
    const amt = round2(p.amount);
    const jlines = p.direction==='in'
      ? [{accountId:cashAcc.id, debit:amt, credit:0},{accountId:counterAcc.id, debit:0, credit:amt}]
      : [{accountId:counterAcc.id, debit:amt, credit:0},{accountId:cashAcc.id, debit:0, credit:amt}];
    const {id:eid,seq:eseq} = nextId('e', state.entries);
    state.entries.push({id:eid,_seq:eseq,no:eseq,date:p.date,desc:'قيد آلي — '+(p.direction==='in'?'مقبوضات':'مدفوعات')+' #'+seq,lines:jlines,auto:true,source:'payment',sourceId:id});
    entryId = eid;
  }
  state.payments.push({id,_seq:seq,no:seq,date:p.date,partyType:p.partyType,partyId:p.partyId||null,otherName:p.otherName||'',direction:p.direction,amount:round2(p.amount),cashAccountId:p.cashAccountId,counterAccountId:p.counterAccountId,note:p.note||'',entryId});
  await saveState();
}
async function deletePayment(id){
  const p = state.payments.find(x=>x.id===id); if(!p) return;
  if(p.entryId) state.entries = state.entries.filter(e=>e.id!==p.entryId);
  state.payments = state.payments.filter(x=>x.id!==id);
  await saveState();
}
function partyName(p){
  if(p.partyType==='customer'){ const c=state.customers.find(x=>x.id===p.partyId); return c?c.name:'عميل محذوف'; }
  if(p.partyType==='supplier'){ const s=state.suppliers.find(x=>x.id===p.partyId); return s?s.name:'مورد محذوف'; }
  if(p.partyType==='employee'){ const e=state.employees.find(x=>x.id===p.partyId); return e?e.name:'موظف محذوف'; }
  return p.otherName || 'أخرى';
}

/* ================================================================
   PARTY STATEMENTS (customers / suppliers / employees)
   ================================================================ */
function customerStatement(customerId, from, to){
  const cust = state.customers.find(c=>c.id===customerId);
  const opening = cust? Number(cust.opening)||0 : 0;
  let rows = [];
  state.salesInvoices.forEach(inv=>{ if(inv.customerId===customerId) rows.push({date:inv.date,_seq:inv._seq,label:'فاتورة مبيعات #'+inv.no, amount:inv.total}); });
  state.payments.forEach(p=>{ if(p.partyType==='customer' && p.partyId===customerId) rows.push({date:p.date,_seq:p._seq,label:(p.direction==='in'?'تحصيل #':'دفعة له #')+p.no, amount: p.direction==='in'? -p.amount : p.amount}); });
  rows = rows.filter(r=> (!from||r.date>=from) && (!to||r.date<=to)).sort((a,b)=> a.date.localeCompare(b.date)||a._seq-b._seq);
  let running = opening;
  const withBalance = rows.map(r=>{ running+=r.amount; return Object.assign({},r,{balance:running}); });
  return {opening, rows:withBalance, closing:running};
}
function supplierStatement(supplierId, from, to){
  const sup = state.suppliers.find(s=>s.id===supplierId);
  const opening = sup? Number(sup.opening)||0 : 0;
  let rows = [];
  state.purchaseInvoices.forEach(inv=>{ if(inv.supplierId===supplierId) rows.push({date:inv.date,_seq:inv._seq,label:'فاتورة مشتريات #'+inv.no, amount:inv.total}); });
  state.payments.forEach(p=>{ if(p.partyType==='supplier' && p.partyId===supplierId) rows.push({date:p.date,_seq:p._seq,label:'دفعة #'+p.no, amount:-p.amount}); });
  rows = rows.filter(r=> (!from||r.date>=from) && (!to||r.date<=to)).sort((a,b)=> a.date.localeCompare(b.date)||a._seq-b._seq);
  let running = opening;
  const withBalance = rows.map(r=>{ running+=r.amount; return Object.assign({},r,{balance:running}); });
  return {opening, rows:withBalance, closing:running};
}
function employeeStatement(employeeId, from, to){
  let rows = [];
  state.payrollSlips.forEach(s=>{ if(s.employeeId===employeeId) rows.push({date:s.date,_seq:s._seq,label:'قسيمة راتب '+s.period, amount:s.net}); });
  state.payments.forEach(p=>{ if(p.partyType==='employee' && p.partyId===employeeId) rows.push({date:p.date,_seq:p._seq,label:'دفعة/سلفة #'+p.no, amount:p.amount}); });
  rows = rows.filter(r=> (!from||r.date>=from) && (!to||r.date<=to)).sort((a,b)=> a.date.localeCompare(b.date)||a._seq-b._seq);
  let running = 0;
  const withBalance = rows.map(r=>{ running+=r.amount; return Object.assign({},r,{balance:running}); });
  return {opening:0, rows:withBalance, closing:running};
}

async function createPayrollSlip(employeeId, period, baseSalary, additions, deductions, date){
  const net = round2(Number(baseSalary)+Number(additions)-Number(deductions));
  const {id,seq} = nextId('ps', state.payrollSlips);
  const expAcc = accountById(state.settings.payrollExpenseAccountId), cashAcc = accountById(state.settings.cashAccountId);
  let entryId=null;
  if(expAcc && cashAcc){
    const jlines=[{accountId:expAcc.id,debit:net,credit:0},{accountId:cashAcc.id,debit:0,credit:net}];
    const {id:eid,seq:eseq}=nextId('e',state.entries);
    state.entries.push({id:eid,_seq:eseq,no:eseq,date,desc:'قيد آلي — صرف راتب '+period,lines:jlines,auto:true,source:'payroll',sourceId:id});
    entryId=eid;
  }
  state.payrollSlips.push({id,_seq:seq,no:seq,employeeId,period,baseSalary:Number(baseSalary),additions:Number(additions),deductions:Number(deductions),net,date,entryId});
  await saveState();
}
async function deletePayrollSlip(id){
  const s = state.payrollSlips.find(x=>x.id===id); if(!s) return;
  if(s.entryId) state.entries = state.entries.filter(e=>e.id!==s.entryId);
  state.payrollSlips = state.payrollSlips.filter(x=>x.id!==id);
  await saveState();
}

/* ================================================================
   FIXED ASSETS & DEPRECIATION
   ================================================================ */
function assetMonthlyDep(asset){ const life = Number(asset.usefulLifeMonths)||1; return round2((Number(asset.cost)-Number(asset.salvage||0))/life); }
function assetAccumDepUpTo(assetId, asOfPeriod){ return round2(state.depreciationRuns.filter(r=>r.assetId===assetId && (!asOfPeriod || r.period<=asOfPeriod)).reduce((s,r)=>s+r.amount,0)); }
function assetNetBookValue(asset, asOfPeriod){ return Math.max(0, round2(Number(asset.cost) - assetAccumDepUpTo(asset.id, asOfPeriod))); }
async function postDepreciation(assetId, period, date){
  const asset = state.assets.find(a=>a.id===assetId); if(!asset) return;
  if(state.depreciationRuns.some(r=>r.assetId===assetId && r.period===period)){ alert('تم ترحيل إهلاك هذا الشهر لهذا الأصل من قبل'); return; }
  const monthly = assetMonthlyDep(asset);
  const accumSoFar = assetAccumDepUpTo(assetId, null);
  const remaining = Math.max(0, round2(Number(asset.cost)-Number(asset.salvage||0)-accumSoFar));
  const amount = Math.min(monthly, remaining);
  if(amount<=0){ alert('الأصل مُهلك بالكامل بالفعل'); return; }
  const expAcc = accountById(state.settings.depreciationExpenseAccountId), accumAcc = accountById(state.settings.accumDepreciationAccountId);
  let entryId=null;
  if(expAcc && accumAcc){
    const jlines=[{accountId:expAcc.id,debit:amount,credit:0},{accountId:accumAcc.id,debit:0,credit:amount}];
    const {id:eid,seq:eseq}=nextId('e',state.entries);
    state.entries.push({id:eid,_seq:eseq,no:eseq,date,desc:'قيد آلي — إهلاك '+asset.name+' لشهر '+period,lines:jlines,auto:true,source:'depreciation',sourceId:null});
    entryId=eid;
  }
  const {id,seq} = nextId('dep', state.depreciationRuns);
  state.depreciationRuns.push({id,_seq:seq,assetId,period,amount,date,entryId});
  await saveState();
}
async function deleteDepreciationRun(id){
  const r = state.depreciationRuns.find(x=>x.id===id); if(!r) return;
  if(r.entryId) state.entries = state.entries.filter(e=>e.id!==r.entryId);
  state.depreciationRuns = state.depreciationRuns.filter(x=>x.id!==id);
  await saveState();
}
function assetStatement(assetId, from, to){
  const asset = state.assets.find(a=>a.id===assetId); if(!asset) return null;
  let rows=[];
  if((!from||asset.acquisitionDate>=from)&&(!to||asset.acquisitionDate<=to)) rows.push({date:asset.acquisitionDate,label:'تكلفة الشراء',amount:asset.cost});
  state.depreciationRuns.filter(r=>r.assetId===assetId).forEach(r=>{ if((!from||r.date>=from)&&(!to||r.date<=to)) rows.push({date:r.date,label:'إهلاك شهر '+r.period,amount:-r.amount}); });
  rows.sort((a,b)=>a.date.localeCompare(b.date));
  const accumTotal = assetAccumDepUpTo(assetId, to? to.slice(0,7): null);
  return {asset, rows, accumTotal, nbv: round2(Number(asset.cost)-accumTotal)};
}

}

function computeCashFlow(from,to){
  const ar = accountById(state.settings.arAccountId), ap = accountById(state.settings.apAccountId);
  const inv = accountById(state.settings.inventoryAccountId), cash = accountById(state.settings.cashAccountId);
  const netIncome = state.accounts.filter(a=>a.type==='إيرادات').reduce((s,a)=>s+accountMovementNet(a,from,to),0) - state.accounts.filter(a=>a.type==='مصروفات').reduce((s,a)=>s+accountMovementNet(a,from,to),0);
  const dep = state.depreciationRuns.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)).reduce((s,r)=>s+r.amount,0);
  const chgAR = ar? accountBalanceAsOf(ar,to)-accountBalanceAsOf(ar,dayBefore(from)||'') : 0;
  const chgAP = ap? accountBalanceAsOf(ap,to)-accountBalanceAsOf(ap,dayBefore(from)||'') : 0;
  const chgInv = inv? accountBalanceAsOf(inv,to)-accountBalanceAsOf(inv,dayBefore(from)||'') : 0;
  const operating = round2(netIncome + dep + chgAP - chgAR - chgInv);
  const investing = round2(-state.assets.filter(a=>(!from||a.acquisitionDate>=from)&&(!to||a.acquisitionDate<=to)).reduce((s,a)=>s+Number(a.cost),0));
  const equityAccs = state.accounts.filter(a=>a.type==='حقوق الملكية');
  const loanAccs = state.accounts.filter(a=>a.type==='خصوم' && a.id!==(ap?ap.id:null));
  const chgEquity = equityAccs.reduce((s,a)=>s+(accountBalanceAsOf(a,to)-accountBalanceAsOf(a,dayBefore(from)||'')),0);
  const chgLoans = loanAccs.reduce((s,a)=>s+(accountBalanceAsOf(a,to)-accountBalanceAsOf(a,dayBefore(from)||'')),0);
  const financing = round2(chgEquity+chgLoans);
  const netChange = round2(operating+investing+financing);
  const actualCashChange = cash? round2(accountBalanceAsOf(cash,to)-accountBalanceAsOf(cash,dayBefore(from)||'')) : null;
  return {netIncome:round2(netIncome), dep:round2(dep), chgAR:round2(chgAR), chgAP:round2(chgAP), chgInv:round2(chgInv), operating, investing, financing, netChange, actualCashChange};
}

function monthOfDate(dateStr){ return (dateStr||'').slice(0,7); }
function actualForAccountPeriod(accountId, period){
  const acc = accountById(accountId); if(!acc) return 0;
  const normal = NORMAL[acc.type]; let debit=0, credit=0;
  state.entries.forEach(e=>{ if(monthOfDate(e.date)!==period) return; e.lines.forEach(l=>{ if(l.accountId===accountId){ debit+=Number(l.debit)||0; credit+=Number(l.credit)||0; } }); });
  return normal==='debit' ? (debit-credit) : (credit-debit);
}

let searchTerms = {};
function filterBySearch(items, key, fields){
  const t = (searchTerms[key]||'').trim().toLowerCase();
  if(!t) return items;
  return items.filter(it => fields.some(f=>{
    const v = typeof f==='function' ? f(it) : it[f];
    return String(v==null?'':v).toLowerCase().includes(t);
  }));
}
function searchBoxHtml(key, placeholder){
  return `<div class="search-box"><input type="text" id="search_${key}" placeholder="${placeholder}" value="${escapeHtml(searchTerms[key]||'')}"></div>`;
}

  const out=[]; const now=new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const y=d.getFullYear(), m=d.getMonth();
    const from = new Date(y,m,1).toISOString().slice(0,10);
    const to = new Date(y,m+1,0).toISOString().slice(0,10);
    out.push({label: y+'-'+String(m+1).padStart(2,'0'), from, to});
  }
  return out;
}

function budgetRowsHtml(){
  const filtered = filterBySearch(state.budgets, 'budget', [b=>{const a=accountById(b.accountId); return a?a.name+' '+a.code:'';}, 'period']);
  const rows = [...filtered].sort((a,b)=> b.period.localeCompare(a.period)).map(b=>{
    const acc = accountById(b.accountId); if(!acc) return '';
    const actual = actualForAccountPeriod(b.accountId, b.period);
    const budgetAmt = Number(b.amount)||0; const isExpense = acc.type==='مصروفات';
    const pct = budgetAmt>0? Math.min(100,(actual/budgetAmt)*100) : 0;
    const over = isExpense? actual>budgetAmt : actual<budgetAmt;
    const barColor = over? 'var(--rust)':'var(--forest)';
    const variance = budgetAmt-actual;
    return `<tr><td class="num">${b.period}</td><td>${acc.code} — ${escapeHtml(acc.name)}</td><td class="num">${fmt(budgetAmt)}</td><td class="num">${fmt(actual)}</td>
      <td class="num" style="color:${variance<0?'var(--rust)':'var(--forest)'};">${fmt(variance)}</td>
      <td style="min-width:120px;"><div class="progress-bar"><div style="width:${pct}%;background:${barColor};"></div></div></td>
      <td><button class="btn btn-danger btn-sm" data-del-budget="${b.id}">حذف</button></td></tr>`;
  }).join('');
  if(!filtered.length) return `<div class="empty-state">لا توجد نتائج</div>`;
  return `<table class="ledger"><thead><tr><th>الشهر</th><th>الحساب</th><th class="num">المخطط</th><th class="num">الفعلي</th><th class="num">الفرق</th><th>النسبة</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function viewInventory(){
  const totalValue = totalInventoryValue();
  const lowCount = state.items.filter(it=>{const r=replayItem(it.id); return it.reorderLevel && r.qty<=Number(it.reorderLevel);}).length;
  if(!invLedgerItemId && state.items.length) invLedgerItemId = state.items[0].id;
  let ledgerHtml = `<div class="empty-state">أضف صنفاً لعرض حركته</div>`;
  if(invLedgerItemId){
    const r = replayItem(invLedgerItemId); let running=0, avg=0, body='';
    r.moves.forEach(m=>{
      if(m.type==='opening'||m.type==='purchase'||m.type==='production_in'){
        const newQty=running+Number(m.qty); const totalVal=running*avg+Number(m.qty)*(Number(m.unitCost)||0);
        avg=newQty>0?totalVal/newQty:0; running=newQty;
        body += `<tr><td class="num">${m.date}</td><td>${MOVE_LABELS[m.type]}</td><td class="num">${fmt(m.qty)}</td><td></td><td class="num">${fmt(running)}</td><td class="num">${fmt(avg)}</td></tr>`;
      } else { running -= Number(m.qty);
        body += `<tr><td class="num">${m.date}</td><td>${MOVE_LABELS[m.type]}</td><td></td><td class="num">${fmt(m.qty)}</td><td class="num">${fmt(running)}</td><td class="num">${fmt(avg)}</td></tr>`; }

  </div>

    </div>

  </div>

let draftBomComponents = [{itemId:'',qty:''}];
let draftProdBomId = '', draftProdQty = '';
function computeProductionPreview(bomId, qty){
  const bom = state.boms.find(b=>b.id===bomId);
  if(!bom || !qty || Number(qty)<=0) return {rows:[], totalCost:0};
  let totalCost=0;
  const rows = bom.components.map(c=>{
    const it = itemById(c.itemId); const need = round2(Number(c.qty)*Number(qty)); const avail = itemQty(c.itemId);
    const cost = need*itemAvgCost(c.itemId); totalCost += cost;
    return {name: it?it.name:'—', need, avail, short: need>avail};
  });
  return {rows, totalCost};
}
function renderProductionPreviewHtml(){
  const p = computeProductionPreview(draftProdBomId, draftProdQty);
  if(!p.rows.length) return `<div class="empty-state">اختر تركيبة وكمية لعرض المعاينة</div>`;
  const rows = p.rows.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td class="num">${fmt(r.need)}</td><td class="num">${fmt(r.avail)}</td><td>${r.short?'<span class="chip low">غير كافٍ</span>':''}</td></tr>`).join('');
  return `<table class="ledger"><thead><tr><th>المكوّن</th><th class="num">المطلوب</th><th class="num">المتاح</th><th></th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="3">التكلفة التقديرية</td><td class="num">${fmt(p.totalCost)}</td></tr></tfoot></table>`;
}

function renderDashboardCharts(){



  if(typeof Chart==='undefined') return;
  const months = lastNMonths(6);
  const revData = months.map(m=> months.map ? state.accounts.filter(a=>a.type==='إيرادات').reduce((s,a)=>s+accountMovementNet(a,m.from,m.to),0) : 0);
  const expData = months.map(m=> state.accounts.filter(a=>a.type==='مصروفات').reduce((s,a)=>s+accountMovementNet(a,m.from,m.to),0));
  const revDataArr = months.map(m=> state.accounts.filter(a=>a.type==='إيرادات').reduce((s,a)=>s+accountMovementNet(a,m.from,m.to),0));

  const ctx1 = document.getElementById('chartRevExp');
  if(ctx1){
    if(chartRevExp) chartRevExp.destroy();
    chartRevExp = new Chart(ctx1, {
      type:'bar',
      data:{ labels: months.map(m=>m.label), datasets:[
        {label:'الإيرادات', data:revDataArr, backgroundColor:'#2c6b4d'},
        {label:'المصروفات', data:expData, backgroundColor:'#a3402f'},
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#2a2517'}}}, scales:{ x:{ticks:{color:'#756f5c'}, grid:{display:false}}, y:{ticks:{color:'#756f5c'}, grid:{color:'#e5ddc8'}} } }
    });
  }
  const ctx2 = document.getElementById('chartComposition');
  if(ctx2){
    if(chartComposition) chartComposition.destroy();
    const liab = sumByType('خصوم'), equity = sumByType('حقوق الملكية');
    const revenue = sumByType('إيرادات'), expense = sumByType('مصروفات');
    const net = revenue-expense;
    chartComposition = new Chart(ctx2, {
      type:'doughnut',
      data:{ labels:['الخصوم','حقوق الملكية','صافي الدخل'], datasets:[{ data:[Math.max(liab,0), Math.max(equity,0), Math.max(net,0)], backgroundColor:['#a3402f','#5b6fa8','#2c6b4d'] }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{color:'#2a2517'}}} }
    });
  }
  const ctx3 = document.getElementById('chartTopCustomers');
  if(ctx3){
    if(chartTopCustomers) chartTopCustomers.destroy();
    const totals = {};
    state.salesInvoices.forEach(inv=>{ totals[inv.customerId] = (totals[inv.customerId]||0) + inv.total; });
    const top = Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const labels = top.map(([id])=>{ const c=state.customers.find(x=>x.id===id); return c?c.name:'—'; });
    const data = top.map(([,v])=>v);
    chartTopCustomers = new Chart(ctx3, {
      type:'bar',
      data:{ labels, datasets:[{ label:'إجمالي المبيعات', data, backgroundColor:'#b6905a' }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#756f5c'}, grid:{color:'#e5ddc8'}}, y:{ticks:{color:'#2a2517'}, grid:{display:false}} } }
    });
  }
}

async function loadLastUsername(){
  if(hasStorage){
    try{ const r = await window.storage.get('accounting-current-user', false); if(r&&r.value) return r.value; }catch(e){}
  }
  if(hasLocalStorage){ try{ return localStorage.getItem('accounting-current-user')||''; }catch(e){} }
  return '';
}
async function persistLastUsername(username){
  if(hasStorage){ try{ await window.storage.set('accounting-current-user', username, false); }catch(e){} }
  if(hasLocalStorage){ try{ localStorage.setItem('accounting-current-user', username); }catch(e){} }
}

async function showLoginGate(){
  const gate=document.getElementById('loginGate');
  document.querySelector('.app').style.display='none';
  gate.style.display='flex';
  gate.innerHTML='<div class="box"></div>'; // مؤقتًا لحين تحديد الحالة

  // noUsers لازم يعتمد على "هل النظام اتظبط قبل كده" مش على state.users
  // الحالية، لأن الخادم عمدًا بيبعت قائمة مستخدمين فاضية للمستخدم غير
  // المدير — فلو اعتمدنا على طولها بس، أي موظف عادي يعمل خروج هيشوف شاشة
  // "إنشاء مدير جديد" ويقدر يمنح نفسه صلاحيات كاملة.
  const setupDone = await loadSetupDone();
  const noUsers = !setupDone && (!state.users || state.users.length===0);

  gate.innerHTML=`<div class="box">
    <h2 style="margin-top:0;color:var(--brass);border-bottom:2px solid var(--brass);padding-bottom:0.6rem;">
      ${noUsers ? 'إعداد حساب المدير' : 'تسجيل الدخول'}
    </h2>
    ${noUsers ? `
      <div class="note">
        لم يتم العثور على مستخدمين محفوظين في هذه النسخة. أنشئ حساب المدير مرة واحدة،
        ثم يمكنك ربطه بـ Google Sheets ونقل المستخدمين والصلاحيات إليه.
      </div>
      <label>اسم المدير</label>
      <input type="text" id="firstAdminName" placeholder="الاسم">
      <div style="margin-top:0.8rem;">
        <label>اسم المستخدم</label>
        <input type="text" id="firstAdminUsername" autocomplete="username" placeholder="مثال: admin">
      </div>
      <div style="margin-top:0.8rem;">
        <label>كلمة المرور</label>
        <input type="password" id="firstAdminPassword" autocomplete="new-password" placeholder="كلمة المرور">
      </div>
      <button class="btn btn-brass" id="createFirstAdminBtn" style="margin-top:1rem;width:100%;">إنشاء المدير والدخول</button>
    ` : `
      <div class="note">${syncUrl
        ? 'الدخول يتم من Google Sheets المشترك، والصلاحيات يفرضها الخادم.'
        : 'الوضع المحلي: يمكنك الدخول بالمستخدمين المحفوظين على هذا الجهاز.'}</div>
      <label>اسم المستخدم</label>
      <input type="text" id="gateUsername" autocomplete="username" placeholder="اسم المستخدم">
      <div style="margin-top:0.8rem;">
        <label>كلمة المرور</label>
        <input type="password" id="gatePassword" autocomplete="current-password" placeholder="كلمة المرور">
      </div>
      <button class="btn btn-brass" id="gateEnterBtn" style="margin-top:1rem;width:100%;">دخول</button>
    `}
    <div id="gateError" class="note" style="color:var(--rust);"></div>
  </div>`;

  if(noUsers){
    const createFirstAdmin = async ()=>{
      const name=document.getElementById('firstAdminName').value.trim();
      const username=document.getElementById('firstAdminUsername').value.trim();
      const password=document.getElementById('firstAdminPassword').value;
      const err=document.getElementById('gateError');
      if(!name||!username||!password){ err.textContent='أكمل الاسم واسم المستخدم وكلمة المرور'; return; }

      const {id,seq}=nextId('u',state.users);
      const admin={id,_seq:seq,name,username,password,role:'admin',allowedTabs:[]};
      state.users=[admin];
      await saveState();
      await persistSetupDone();

      currentUser=admin;
      await persistLastUsername(username);
      gate.style.display='none';
      document.querySelector('.app').style.display='flex';
      activeTab='dashboard';
      renderAll();
    };

    document.getElementById('createFirstAdminBtn').addEventListener('click',createFirstAdmin);
    document.getElementById('firstAdminPassword').addEventListener('keydown',e=>{
      if(e.key==='Enter') createFirstAdmin();
    });
    return;
  }

  const uin=document.getElementById('gateUsername');
  const pin=document.getElementById('gatePassword');

  loadLastUsername().then(v=>{ if(v) uin.value=v; uin.focus(); });

  const doLogin=async()=>{
    const username=uin.value.trim();
    const password=pin.value;
    const err=document.getElementById('gateError');

    if(!username||!password){
      err.textContent='أدخل اسم المستخدم وكلمة المرور';
      return;
    }

    // إن كان الحساب مسؤول (admin) محفوظ محليًا وكلمة السر مطابقة، اسمح له بالدخول
    // محليًا فورًا بدون المرور بالخادم — بذلك لا يُحبس المسؤول خارج النظام أبدًا
    // بسبب مشاكل الربط بجوجل شيت (رابط غير مهيأ، تعطل الاتصال، ...إلخ).
    const localAdminMatch = state.users.find(x=>
      (x.username||'').toLowerCase()===username.toLowerCase() && x.role==='admin'
    );
    const localAdminOk = localAdminMatch && password===((localAdminMatch.password!=null&&localAdminMatch.password!=='')?localAdminMatch.password:(localAdminMatch.pin||''));

    try{
      if(syncUrl){
        let r=null, serverError=null;
        try{ r=await apiRequest({action:'login',username,password}); }
        catch(netErr){ serverError=netErr; }

        // الخادم رد لكن الشيت لسه ما اتعمل له "تهيئة الأمان"، أو تعذّر الوصول
        // للخادم أصلاً: لو الحساب ده مسؤول محلي وكلمة السر صح، ادخّله محليًا
        // بدل ما توقفه رسالة "فشل تسجيل الدخول" العامة.
        if((!r || r.status==='not_initialized' || serverError) && localAdminOk){
          currentUser=localAdminMatch;
          await persistLastUsername(username);
          await persistSetupDone();
          gate.style.display='none';
          document.querySelector('.app').style.display='flex';
          activeTab='dashboard';
          renderAll();
          if(!securityMode){
            setTimeout(()=>alert('دخلت كمسؤول محليًا. لتفعيل المزامنة والصلاحيات من جوجل شيت للجميع، روح لـ الإعدادات والمزامنة واضغط "تهيئة الأمان ونقل المستخدمين" مرة واحدة.'),300);
          }
          return;
        }

        if(!r) throw serverError||new Error('تعذر الاتصال بالخادم');
        if(r.status!=='ok') throw new Error(r.message||'فشل تسجيل الدخول');

        await persistSecurityToken(r.token);
        securityMode=true;
        currentUser=r.user;

        const st=await apiRequest({action:'getState',token:securityToken});
        state=Object.assign(JSON.parse(JSON.stringify(EMPTY_STATE)),st.data||{});

        if(currentUser.role==='admin'){
          const gu=await apiRequest({action:'getUsers',token:securityToken});
          state.users=gu.users||[];
        }

        await persistLastUsername(username);
        await persistSetupDone();
        gate.style.display='none';
        document.querySelector('.app').style.display='flex';
        activeTab='dashboard';
        renderAll();
        return;
      }

      const user=state.users.find(x=>
        (x.username||'').toLowerCase()===username.toLowerCase()
      );
      if(!user) throw new Error('اسم المستخدم غير موجود');

      const expected=(user.password!=null&&user.password!=='')
        ? user.password
        : (user.pin||'');

      if(password!==expected)
        throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة');

      currentUser=user;
      await persistLastUsername(username);
      await persistSetupDone();
      gate.style.display='none';
      document.querySelector('.app').style.display='flex';
      activeTab='dashboard';
      renderAll();

    }catch(e){
      err.textContent=e.message||'فشل تسجيل الدخول';
    }
  };

  document.getElementById('gateEnterBtn').addEventListener('click',doLogin);
  pin.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  uin.addEventListener('keydown',e=>{if(e.key==='Enter')pin.focus();});
}

function setupDelegatedActions(){
  document.addEventListener('click', async (e)=>{
    const el = e.target.closest('[data-del-account],[data-del-entry],[data-del-budget],[data-del-item],[data-del-customer],[data-del-supplier],[data-del-employee],[data-del-sale],[data-del-purchase],[data-del-bom],[data-del-order],[data-del-payment],[data-del-asset],[data-del-deprun],[data-del-payroll],[data-del-user]');
    if(!el) return;
    if(el.dataset.delAccount){
      const id = el.dataset.delAccount;
      const used = state.entries.some(en=>en.lines.some(l=>l.accountId===id));
      if(used && !confirm('الحساب ده مستخدم في قيود موجودة، تأكيد الحذف؟')) return;
      state.accounts = state.accounts.filter(a=>a.id!==id); ensureSettings(); await saveState(); renderAll();
    } else if(el.dataset.delEntry){
      if(!confirm('تأكيد حذف القيد؟')) return;
      state.entries = state.entries.filter(x=>x.id!==el.dataset.delEntry); await saveState(); renderAll();
    } else if(el.dataset.delBudget){
      state.budgets = state.budgets.filter(x=>x.id!==el.dataset.delBudget); await saveState(); renderAll();
    } else if(el.dataset.delItem){
      const id = el.dataset.delItem;
      const used = state.stockMovements.some(m=>m.itemId===id) || state.boms.some(bm=>bm.productItemId===id||bm.components.some(c=>c.itemId===id));
      if(used && !confirm('الصنف ده له حركة أو مستخدم في تركيبة، تأكيد الحذف؟')) return;
      state.items = state.items.filter(it=>it.id!==id); await saveState(); renderAll();
    } else if(el.dataset.delCustomer){
      state.customers = state.customers.filter(c=>c.id!==el.dataset.delCustomer); await saveState(); renderAll();
    } else if(el.dataset.delSupplier){
      state.suppliers = state.suppliers.filter(s=>s.id!==el.dataset.delSupplier); await saveState(); renderAll();
    } else if(el.dataset.delEmployee){
      state.employees = state.employees.filter(x=>x.id!==el.dataset.delEmployee); await saveState(); renderAll();
    } else if(el.dataset.delSale){
      if(!confirm('تأكيد حذف الفاتورة؟ سيتم إلغاء حركة المخزون والقيد المرتبط.')) return;
      await deleteSalesInvoice(el.dataset.delSale); renderAll();
    } else if(el.dataset.delPurchase){
      if(!confirm('تأكيد حذف الفاتورة؟ سيتم إلغاء حركة المخزون والقيد المرتبط.')) return;
      await deletePurchaseInvoice(el.dataset.delPurchase); renderAll();
    } else if(el.dataset.delBom){
      state.boms = state.boms.filter(x=>x.id!==el.dataset.delBom); await saveState(); renderAll();
    } else if(el.dataset.delOrder){
      if(!confirm('تأكيد حذف أمر الإنتاج؟ سيتم التراجع عن حركة المخزون.')) return;
      await deleteProductionOrder(el.dataset.delOrder); renderAll();
    } else if(el.dataset.delPayment){
      if(!confirm('تأكيد حذف الحركة؟ سيتم إلغاء القيد المرتبط.')) return;
      await deletePayment(el.dataset.delPayment); renderAll();
    } else if(el.dataset.delAsset){
      const id = el.dataset.delAsset;
      const used = state.depreciationRuns.some(r=>r.assetId===id);
      if(used && !confirm('يوجد إهلاك مرحّل لهذا الأصل، تأكيد الحذف؟')) return;
      state.assets = state.assets.filter(a=>a.id!==id); await saveState(); renderAll();
    } else if(el.dataset.delDeprun){
      await deleteDepreciationRun(el.dataset.delDeprun); renderAll();
    } else if(el.dataset.delPayroll){
      await deletePayrollSlip(el.dataset.delPayroll); renderAll();
    } else if(el.dataset.delUser){
      if(!currentUser || currentUser.role!=='admin'){alert('ليس لديك صلاحية');return;}
      state.users = state.users.filter(u=>u.id!==el.dataset.delUser);
      if(securityMode && securityToken){ try{ const r=await apiRequest({action:'saveUsers',token:securityToken,users:state.users}); state.users=r.users||state.users; }catch(e){alert(e.message||'تعذر حذف المستخدم');return;} }
      else await saveState();
      renderAll();
    }
  });
}

/* ================================================================
   SEARCH WIRING (partial re-render, keeps input focus)
   ================================================================ */
function wireSearch(key, wrapId, computeHtml){
  const input = document.getElementById('search_'+key);
  if(!input) return;
  input.addEventListener('input', ()=>{
    searchTerms[key] = input.value;
    const wrap = document.getElementById(wrapId);
    if(wrap) wrap.innerHTML = computeHtml();
  });
}

/* ================================================================
   LINE EDITOR WIRING
   ================================================================ */
function wireLineEditor(containerId, draftArr, recalcFn, onStructuralChange){
  const root = document.getElementById(containerId);
  if(!root) return;
  root.querySelectorAll('[data-li-index]').forEach(el=>{
    const idx = +el.dataset.liIndex, field = el.dataset.liField;
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{ draftArr[idx][field] = el.value; if(recalcFn) recalcFn(); });
  });
  root.querySelectorAll('[data-li-remove]').forEach(el=>{
    el.addEventListener('click', ()=>{ draftArr.splice(+el.dataset.liRemove,1); onStructuralChange(); });
  });
}
